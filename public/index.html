<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JJ LIN Radar V1</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <p class="eyebrow">公开来源雷达</p>
        <h1>JJ LIN Radar V1</h1>
        <p class="lede">追踪林俊杰公开动态，并把可验证的演出、售票、见面会等信息单独归入行程。</p>
      </header>

      <section class="status-bar" aria-live="polite">
        <div>
          <span class="label">采集状态</span>
          <strong id="status">加载中</strong>
        </div>
        <div>
          <span class="label">更新时间</span>
          <strong id="updated">--</strong>
        </div>
      </section>

      <section class="section">
        <div class="section-title">
          <h2>行程</h2>
          <span id="schedule-count">0</span>
        </div>
        <div id="schedules" class="list"></div>
      </section>

      <section class="section">
        <div class="section-title">
          <h2>公开动态</h2>
          <span id="update-count">0</span>
        </div>
        <div id="updates" class="list"></div>
      </section>

      <section class="section">
        <div class="section-title">
          <h2>来源</h2>
        </div>
        <div id="sources" class="sources"></div>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
